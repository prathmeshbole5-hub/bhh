<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#300821" />
      <stop offset="100%" stop-color="#631038" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4c430" />
      <stop offset="50%" stop-color="#fff2a3" />
      <stop offset="100%" stop-color="#e5a93c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="16" fill="url(#bg-4)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <!-- Decorative Border -->
  <rect x="24" y="24" width="752" height="552" rx="12" fill="none" stroke="url(#gold-accent)" stroke-width="2" opacity="0.4" stroke-dasharray="8 6" />

  <!-- Center Decorative Glow Circle -->
  <circle cx="400" cy="250" r="90" fill="#ffffff" opacity="0.04" filter="url(#glow)" />
  <circle cx="400" cy="250" r="70" fill="none" stroke="url(#gold-accent)" stroke-width="2" opacity="0.7" />

  <!-- Icon Emoji -->
  <text x="400" y="265" font-family="'Apple Color Emoji', 'Segoe UI Emoji', sans-serif" font-size="54" text-anchor="middle">🎂</text>

  <!-- Photo Slot Number Badge -->
  <rect x="360" y="340" width="80" height="28" rx="14" fill="#ffffff" opacity="0.15" />
  <text x="400" y="359" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">PHOTO #4</text>

  <!-- Main Title -->
  <text x="400" y="420" font-family="'Rozha One', 'Mukta', 'Segoe UI', sans-serif" font-weight="700" font-size="28" fill="#ffffff" text-anchor="middle" filter="url(#glow)">वाढदिवसाचा हा खास दिवस</text>
  
  <!-- Subtitle Instruction -->
  <text x="400" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#e8a5b8" text-anchor="middle" opacity="0.9">Birthday Celebration Slot</text>

  <!-- Bottom File Hint -->
  <text x="400" y="520" font-family="monospace" font-size="13" fill="#f4c430" text-anchor="middle" opacity="0.8">Replace with: /assets/neha4.jpg</text>
</svg>